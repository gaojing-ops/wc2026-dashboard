<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>网站准备中</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #25324a;
      background: #f7f8fb;
    }

    main {
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
    }

    p {
      margin: 0;
      color: #667085;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>网站准备中</h1>
    <p>新内容即将上线</p>
  </main>
</body>
</html>
